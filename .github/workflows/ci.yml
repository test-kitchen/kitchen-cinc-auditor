---
name: 'Lint & Unit Tests'

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-unit:
    uses: test-kitchen/.github/.github/workflows/lint-unit.yml@main

  quality:
    name: RubyCritic
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run RubyCritic
        run: bundle exec rake quality
